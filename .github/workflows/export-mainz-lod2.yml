name: Export Mainz LoD2 buildings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-lod2.txt
      - name: Match POIs and build mesh tiles
        run: python scripts/export_lod2_buildings.py --rlp --osm-ways --output /tmp/windowlens/assets/buildings/lod2
      - uses: actions/upload-artifact@v4
        with:
          name: windowlens-mainz-lod2
          path: /tmp/windowlens/
          if-no-files-found: error
